name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  railway-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Stage admin assets into backend
        run: |
          rm -rf backend/public/admin
          mkdir -p backend/public/admin
          cp -r frontend/dist/. backend/public/admin/

      - name: Verify site app config is in sync and honest
        shell: bash
        run: |
          set -euo pipefail
          # Guards against a fabricated App Store URL, an iOS url with no bundle
          # id, a missing app, a stale static page, and leaked secrets.
          pwsh -File scripts/sync-site-apps.ps1 -Verify
          node scripts/verify-site-config.mjs

      - name: Install Railway CLI (pinned 5.30.4)
        run: npm install -g @railway/cli@5.30.4

      - name: Restore Railway session
        env:
          RAILWAY_CONFIG: ${{ secrets.RAILWAY_CONFIG }}
        run: |
          mkdir -p "$HOME/.railway"
          printf '%s' "$RAILWAY_CONFIG" | base64 -d > "$HOME/.railway/config.json"
          chmod 600 "$HOME/.railway/config.json"
          wc -c "$HOME/.railway/config.json"
          python3 -c "import json,sys;json.load(open(sys.argv[1]));print('config json OK')" "$HOME/.railway/config.json"
          railway whoami

      - name: Deploy to Railway (production)
        working-directory: backend
        run: |
          # NOT --detach: `railway up --detach` returns 0 as soon as the source
          # is uploaded, so a failed Railway build looked like a successful
          # deploy while production kept serving the previous code.
          railway up \
            --project df871066-14b2-4fbc-b218-1782d72063be \
            --environment production \
            --service getinroute-app

      - name: Verify the new build is actually live
        run: |
          # /health returns a build id = sha256(server.js)[:12]. Compare it to
          # the file that was just deployed so a rollback / failed build is caught.
          EXPECTED=$(sha256sum backend/server.js | cut -c1-12)
          echo "expected build id: $EXPECTED"
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 20 https://getinroute.in/health || true)
            echo "  attempt $i: $BODY"
            ACTUAL=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "DEPLOY VERIFIED: live build id matches ($ACTUAL)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::deploy not live - expected build $EXPECTED, live build '${ACTUAL:-none}'"
              exit 1
            fi
            sleep 10
          done

      - name: Verify the live APKs are the ones that were committed
        run: |
          # The build id above only moves when server.js changes, so a deploy
          # that ships nothing but new binaries would sail through it. The APK
          # volume is also sticky: a stale copy on the volume keeps winning over
          # the image, so the only trustworthy check is to hash what is actually
          # served and compare it with the file in this commit.
          rc=0
          for f in GetInRoute.apk GetInRouteDriver.apk GetInRouteSchool.apk; do
            local_sha=$(sha256sum "backend/binaries/$f" | cut -d' ' -f1)
            live_sha=$(curl -fsS --max-time 300 "https://www.getinroute.in/download/$f" | sha256sum | cut -d' ' -f1)
            if [ "$local_sha" = "$live_sha" ]; then
              echo "OK   $f  $live_sha"
            else
              echo "::error::$f live copy differs - committed $local_sha, served $live_sha"
              rc=1
            fi
          done
          exit $rc
