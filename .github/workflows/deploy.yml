name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  railway-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Stage admin assets into backend
        run: |
          rm -rf backend/public/admin
          mkdir -p backend/public/admin
          cp -r frontend/dist/. backend/public/admin/

      - name: Install Railway CLI (pinned 5.30.4)
        run: npm install -g @railway/cli@5.30.4

      - name: Restore Railway session
        env:
          RAILWAY_CONFIG: ${{ secrets.RAILWAY_CONFIG }}
        run: |
          mkdir -p "$HOME/.railway"
          printf '%s' "$RAILWAY_CONFIG" | base64 -d > "$HOME/.railway/config.json"
          chmod 600 "$HOME/.railway/config.json"
          wc -c "$HOME/.railway/config.json"
          python3 -c "import json,sys;json.load(open(sys.argv[1]));print('config json OK')" "$HOME/.railway/config.json"
          railway whoami

      - name: Deploy to Railway (production)
        working-directory: backend
        run: |
          # NOT --detach: `railway up --detach` returns 0 as soon as the source
          # is uploaded, so a failed Railway build looked like a successful
          # deploy while production kept serving the previous code.
          railway up \
            --project df871066-14b2-4fbc-b218-1782d72063be \
            --environment production \
            --service getinroute-app

      - name: Verify the new build is actually live
        run: |
          # /health returns a build id = sha256(server.js)[:12]. Compare it to
          # the file that was just deployed so a rollback / failed build is caught.
          EXPECTED=$(sha256sum backend/server.js | cut -c1-12)
          echo "expected build id: $EXPECTED"
          for i in $(seq 1 30); do
            BODY=$(curl -fsS --max-time 20 https://getinroute.in/health || true)
            echo "  attempt $i: $BODY"
            ACTUAL=$(echo "$BODY" | python3 -c "import sys,json;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "DEPLOY VERIFIED: live build id matches ($ACTUAL)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::deploy not live - expected build $EXPECTED, live build '${ACTUAL:-none}'"
          exit 1
