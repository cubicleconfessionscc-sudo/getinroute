name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  railway-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Enable GitHub autodeploy source (best-effort)
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway service source connect --repo cubicleconfessionscc-sudo/getinroute --branch main --service getinroute-app || echo "source connect skipped"

      - name: Deploy to Railway (production)
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach \
            --project df871066-14b2-4fbc-b218-1782d72063be \
            --environment production \
            --service getinroute-app \
            --message "deploy $(git rev-parse --short HEAD)"